# api-langs-bench: every service, the gates included (spec/decisions/0011).
#
# A backend starts with: docker compose up -d --wait <name>
# The gates are tools, run one at a time: docker compose run --rm <name>-checks
# Each gate mounts its source read-only, so it checks the current code; caches go to /tmp.

name: api-langs-bench

# Each backend's limits, the same for every backend, provisional until plan step 3.1
# (spec/decisions/0020). They're repeated in each backend's service: `cpus` and `mem_limit`.

# The contract's settings, the same for every backend (contract/README.md#settings).
x-backend-environment: &backend-environment
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://fake-server:8080/v1}
  LLM_MODEL: ${LLM_MODEL:-local}
  LLM_API_KEY: ${LLM_API_KEY:-local}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
  LLM_MAX_CONNECTIONS: ${LLM_MAX_CONNECTIONS:-1000}
  FAKE_ANSWER_TOKENS: ${FAKE_ANSWER_TOKENS:-256}
  FAKE_REASONING_TOKENS: ${FAKE_REASONING_TOKENS:-0}
  FAKE_FIRST_TOKEN_MS: ${FAKE_FIRST_TOKEN_MS:-0}
  FAKE_TOKEN_GAP_MS: ${FAKE_TOKEN_GAP_MS:-0}

services:
  # The Python backend: FastAPI on uvicorn (spec/decisions/0014).
  python-fastapi:
    build:
      context: backends/python-fastapi
      target: runtime
      additional_contexts:
        contract: contract
    environment: *backend-environment
    cpus: ${BACKEND_CPUS:-1}
    mem_limit: ${BACKEND_MEMORY:-512m}
    ports:
      - 127.0.0.1:${PYTHON_FASTAPI_PORT:-8001}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=4)
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # The Go backend on net/http alone: docker compose up -d --wait go-nethttp
  go-nethttp:
    build:
      context: backends/go
      target: runtime
      args:
        SERVER: nethttp
      additional_contexts:
        contract: contract
    environment: *backend-environment
    cpus: ${BACKEND_CPUS:-1}
    mem_limit: ${BACKEND_MEMORY:-512m}
    ports:
      - 127.0.0.1:${GO_NETHTTP_PORT:-8002}:8000
    # The image has no shell, so the server asks itself (spec/decisions/0016).
    healthcheck:
      test:
        - CMD
        - /app/server
        - healthcheck
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # The Go backend on Gin: docker compose up -d --wait go-gin
  go-gin:
    build:
      context: backends/go
      target: runtime
      args:
        SERVER: gin
      additional_contexts:
        contract: contract
    environment: *backend-environment
    cpus: ${BACKEND_CPUS:-1}
    mem_limit: ${BACKEND_MEMORY:-512m}
    ports:
      - 127.0.0.1:${GO_GIN_PORT:-8003}:8000
    healthcheck:
      test:
        - CMD
        - /app/server
        - healthcheck
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # The fake upstream server, shaped like llama.cpp's (spec/decisions/0023):
  # docker compose up -d --wait fake-server. A helper, so it has no limits.
  fake-server:
    build:
      context: fake-server
      target: runtime
      additional_contexts:
        contract: contract
    environment:
      FAKE_ANSWER_TOKENS: ${FAKE_ANSWER_TOKENS:-256}
      FAKE_REASONING_TOKENS: ${FAKE_REASONING_TOKENS:-0}
      FAKE_FIRST_TOKEN_MS: ${FAKE_FIRST_TOKEN_MS:-0}
      FAKE_TOKEN_GAP_MS: ${FAKE_TOKEN_GAP_MS:-0}
    ports:
      - 127.0.0.1:${FAKE_SERVER_PORT:-8010}:8080
    # The image has no shell, so the server asks itself.
    healthcheck:
      test:
        - CMD
        - /app/server
        - healthcheck
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # llama.cpp's server, with one small model on CPU (spec/decisions/0025). In a profile, so it
  # starts only when named: docker compose up -d --wait llama-cpp. The first start downloads the
  # model, 533 MB, into the llama-models volume. A helper, so it has no limits.
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b12242@sha256:4d2de15a0ffbce704777c64026b40512a71e0bbc0b303a5fe5ea9bf71760dff9
    profiles: [llm]
    command:
      # The file at that URL, downloaded to that path once, then loaded from there.
      - --model
      - /models/${LLAMA_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}
      - --model-url
      - ${LLAMA_MODEL_URL:-https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/6ab461498e20/Qwen3.5-0.8B-Q4_K_M.gguf}
      # Text only: no image or audio component.
      - --no-mmproj
      - --parallel
      - ${LLAMA_SLOTS:-4}
      - --ctx-size
      - ${LLAMA_CONTEXT_SIZE:-8192}
    environment:
      # Set explicitly, as ai-bootstrap does: llama.cpp plans to change its default port.
      LLAMA_ARG_PORT: 8080
      # Only pages served from this machine may call it from a browser. The backends call it
      # from inside Docker, where CORS doesn't apply.
      LLAMA_ARG_CORS_ORIGINS: localhost
    volumes:
      - llama-models:/models
    ports:
      - 127.0.0.1:${LLAMA_PORT:-8020}:8080
    # The image's own check: /health answers 503 while the model loads.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      # The first start downloads the model, so failures count only after 30 minutes.
      start_period: 30m
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  # The contract's lint: docker compose run --rm contract-checks
  contract-checks:
    image: redocly/cli:2.69.0
    profiles: [tools]
    volumes:
      - ./contract:/spec:ro
    environment:
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
    command: ["lint", "--format=stylish", "openapi.yaml"]

  # The Python backend's gates: docker compose run --rm python-fastapi-checks
  # After a dependency changes, run `docker compose build python-fastapi-checks` first.
  python-fastapi-checks:
    build:
      context: backends/python-fastapi
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./backends/python-fastapi:/app:ro
      - ./contract:/contract:ro
    environment:
      COVERAGE_FILE: /tmp/.coverage
      MYPY_CACHE_DIR: /tmp/.mypy_cache
      RUFF_CACHE_DIR: /tmp/.ruff_cache
    command:
      - sh
      - -c
      - ruff check && ruff format --check && mypy && pytest -p no:cacheprovider

  # The Go backend's gates: docker compose run --rm go-checks
  # golangci-lint also reports unformatted files (gofmt, goimports). Go has no coverage minimum
  # of its own: the awk line fails below 90%, as the Python gates do.
  go-checks:
    build:
      context: backends/go
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./backends/go:/src:ro
      - ./contract:/contract:ro
      # Go's build cache and golangci-lint's, kept between runs: without them, every run
      # compiles Gin and its dependencies again, with the race detector.
      - go-build-cache:/tmp/go-build
      - golangci-lint-cache:/tmp/golangci-lint
    environment:
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    command:
      - sh
      - -c
      - >-
        golangci-lint run
        && go test -race -shuffle=on -covermode=atomic -coverpkg=./... -coverprofile=/tmp/cover.out ./...
        && go tool cover -func=/tmp/cover.out
        | awk '/^total:/ { sub("%", "", $$3); print "coverage: " $$3 "%";
        if ($$3 + 0 < 90) { print "below 90%"; exit 1 } }'

  # The fake server's gates, the same as the Go backends': docker compose run --rm fake-server-checks
  fake-server-checks:
    build:
      context: fake-server
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./fake-server:/src:ro
      - ./contract:/contract:ro
      - go-build-cache:/tmp/go-build
      - golangci-lint-cache:/tmp/golangci-lint
    environment:
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    command:
      - sh
      - -c
      - >-
        golangci-lint run
        && go test -race -shuffle=on -covermode=atomic -coverpkg=./... -coverprofile=/tmp/cover.out ./...
        && go tool cover -func=/tmp/cover.out
        | awk '/^total:/ { sub("%", "", $$3); print "coverage: " $$3 "%";
        if ($$3 + 0 < 90) { print "below 90%"; exit 1 } }'

  # The evaluation tool's gates: docker compose run --rm bench-checks
  # After a dependency changes, run `docker compose build bench-checks` first.
  bench-checks:
    build:
      context: bench
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./bench:/app:ro
      - ./contract:/contract:ro
    environment:
      COVERAGE_FILE: /tmp/.coverage
      MYPY_CACHE_DIR: /tmp/.mypy_cache
      RUFF_CACHE_DIR: /tmp/.ruff_cache
    command:
      - sh
      - -c
      - ruff check && ruff format --check && mypy && pytest -p no:cacheprovider

  # The conformance suite: docker compose run --rm conformance
  # pytest's options may follow, such as `-k go-gin`. It starts the backends first, building any
  # image that's missing; after a backend's code changes, run `docker compose build` first. It
  # restarts each backend with the settings each check needs, through Docker's socket, which
  # gives it root on Docker's host, and leaves each running with the settings below
  # (spec/decisions/0017).
  conformance:
    build:
      context: bench
      target: conformance
      additional_contexts:
        contract: contract
    profiles: [tools]
    depends_on:
      python-fastapi:
        condition: service_healthy
      go-nethttp:
        condition: service_healthy
      go-gin:
        condition: service_healthy
      fake-server:
        condition: service_healthy
    volumes:
      - ./bench:/app:ro
      - ./contract:/contract:ro
      # compose.yaml and .env, for the Compose inside it.
      - .:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # The settings and ports the backends get outside, so the Compose inside restores the same.
    environment:
      <<: *backend-environment
      PYTHON_FASTAPI_PORT: ${PYTHON_FASTAPI_PORT:-8001}
      GO_NETHTTP_PORT: ${GO_NETHTTP_PORT:-8002}
      GO_GIN_PORT: ${GO_GIN_PORT:-8003}
      FAKE_SERVER_PORT: ${FAKE_SERVER_PORT:-8010}
      LLAMA_PORT: ${LLAMA_PORT:-8020}
      LLAMA_MODEL_URL: ${LLAMA_MODEL_URL:-https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/6ab461498e20/Qwen3.5-0.8B-Q4_K_M.gguf}
      LLAMA_MODEL_FILE: ${LLAMA_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}
      LLAMA_SLOTS: ${LLAMA_SLOTS:-4}
      LLAMA_CONTEXT_SIZE: ${LLAMA_CONTEXT_SIZE:-8192}
      BACKEND_CPUS: ${BACKEND_CPUS:-1}
      BACKEND_MEMORY: ${BACKEND_MEMORY:-512m}

  # The runner: docker compose run --rm runner
  # `--backend go-gin`, `--rate 100` and `--passes 1` may follow. It sends one workload, at a
  # ladder of rates, to each backend in turn, the others stopped, in three passes, and saves
  # each run once in runs/ (spec/decisions/0018, spec/decisions/0020). Like the
  # conformance suite, it starts the backends through Docker's socket, and leaves each running
  # with the settings below.
  runner:
    build:
      context: bench
      target: runner
      additional_contexts:
        contract: contract
    profiles: [tools]
    depends_on:
      python-fastapi:
        condition: service_healthy
      go-nethttp:
        condition: service_healthy
      go-gin:
        condition: service_healthy
    volumes:
      - ./bench:/app:ro
      - ./contract:/contract:ro
      - .:/repo:ro
      - ./runs:/runs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *backend-environment
      PYTHON_FASTAPI_PORT: ${PYTHON_FASTAPI_PORT:-8001}
      GO_NETHTTP_PORT: ${GO_NETHTTP_PORT:-8002}
      GO_GIN_PORT: ${GO_GIN_PORT:-8003}
      FAKE_SERVER_PORT: ${FAKE_SERVER_PORT:-8010}
      BACKEND_CPUS: ${BACKEND_CPUS:-1}
      BACKEND_MEMORY: ${BACKEND_MEMORY:-512m}
      BENCH_MACHINE: ${BENCH_MACHINE:-}
    # One open file for each connection: the default, 1,024, fails requests at the higher rates
    # (spec/decisions/0020).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Rewrites a Python project's uv.lock after its dependencies change, then rebuild its checks:
  #   docker compose run --rm python-lock bench
  #   docker compose run --rm python-lock backends/python-fastapi
  python-lock:
    build:
      context: backends/python-fastapi
      target: base
    profiles: [tools]
    volumes:
      - ./backends/python-fastapi:/work/backends/python-fastapi
      - ./bench:/work/bench
    working_dir: /work
    entrypoint: ["uv", "lock", "--directory"]

  # Go's module files, after a dependency changes:
  #   docker compose run --rm go-mod tidy
  # Then `docker compose build go-checks`.
  go-mod:
    build:
      context: backends/go
      target: base
    profiles: [tools]
    volumes:
      - ./backends/go:/src
    entrypoint: ["go", "mod"]

# Caches the gates keep between runs. `docker compose down --volumes` clears them.
volumes:
  go-build-cache:
  # llama.cpp's model, downloaded once.
  llama-models:
  golangci-lint-cache:
