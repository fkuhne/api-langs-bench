# api-langs-bench: every service, the gates included (spec/decisions/0011).
#
# A backend starts with: docker compose up -d --wait <name>
# The gates are tools, run one at a time: docker compose run --rm <name>-checks
# Each gate mounts its source read-only, so it checks the current code; caches go to /tmp.

name: api-langs-bench

# The contract's settings, the same for every backend (contract/README.md#settings).
x-backend-environment: &backend-environment
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  FAKE_ANSWER_TOKENS: ${FAKE_ANSWER_TOKENS:-256}
  FAKE_REASONING_TOKENS: ${FAKE_REASONING_TOKENS:-0}
  FAKE_FIRST_TOKEN_MS: ${FAKE_FIRST_TOKEN_MS:-0}
  FAKE_TOKEN_GAP_MS: ${FAKE_TOKEN_GAP_MS:-0}

services:
  # The Python backend: FastAPI on uvicorn (spec/decisions/0014).
  python-fastapi:
    build:
      context: backends/python-fastapi
      target: runtime
      additional_contexts:
        contract: contract
    environment: *backend-environment
    ports:
      - 127.0.0.1:${PYTHON_FASTAPI_PORT:-8001}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=4)
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # The Go backend on net/http alone: docker compose up -d --wait go-nethttp
  go-nethttp:
    build:
      context: backends/go
      target: runtime
      args:
        SERVER: nethttp
      additional_contexts:
        contract: contract
    environment: *backend-environment
    ports:
      - 127.0.0.1:${GO_NETHTTP_PORT:-8002}:8000
    # The image has no shell, so the server asks itself (spec/decisions/0016).
    healthcheck:
      test:
        - CMD
        - /app/server
        - healthcheck
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  # The contract's lint: docker compose run --rm contract-checks
  contract-checks:
    image: redocly/cli:2.69.0
    profiles: [tools]
    volumes:
      - ./contract:/spec:ro
    environment:
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
    command: ["lint", "--format=stylish", "openapi.yaml"]

  # The Python backend's gates: docker compose run --rm python-fastapi-checks
  # After a dependency changes, run `docker compose build python-fastapi-checks` first.
  python-fastapi-checks:
    build:
      context: backends/python-fastapi
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./backends/python-fastapi:/app:ro
      - ./contract:/contract:ro
    environment:
      COVERAGE_FILE: /tmp/.coverage
      MYPY_CACHE_DIR: /tmp/.mypy_cache
      RUFF_CACHE_DIR: /tmp/.ruff_cache
    command:
      - sh
      - -c
      - ruff check && ruff format --check && mypy && pytest -p no:cacheprovider

  # The Go backend's gates: docker compose run --rm go-checks
  # golangci-lint also reports unformatted files (gofmt, goimports). Go has no coverage minimum
  # of its own: the awk line fails below 90%, as the Python gates do.
  go-checks:
    build:
      context: backends/go
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./backends/go:/src:ro
      - ./contract:/contract:ro
    environment:
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    command:
      - sh
      - -c
      - >-
        golangci-lint run
        && go test -race -shuffle=on -covermode=atomic -coverpkg=./... -coverprofile=/tmp/cover.out ./...
        && go tool cover -func=/tmp/cover.out
        | awk '/^total:/ { sub("%", "", $$3); print "coverage: " $$3 "%";
        if ($$3 + 0 < 90) { print "below 90%"; exit 1 } }'

  # The evaluation tool's gates: docker compose run --rm bench-checks
  # After a dependency changes, run `docker compose build bench-checks` first.
  bench-checks:
    build:
      context: bench
      target: dev
      additional_contexts:
        contract: contract
    profiles: [tools]
    volumes:
      - ./bench:/app:ro
      - ./contract:/contract:ro
    environment:
      COVERAGE_FILE: /tmp/.coverage
      MYPY_CACHE_DIR: /tmp/.mypy_cache
      RUFF_CACHE_DIR: /tmp/.ruff_cache
    command:
      - sh
      - -c
      - ruff check && ruff format --check && mypy && pytest -p no:cacheprovider

  # Rewrites a Python project's uv.lock after its dependencies change, then rebuild its checks:
  #   docker compose run --rm python-lock bench
  #   docker compose run --rm python-lock backends/python-fastapi
  python-lock:
    build:
      context: backends/python-fastapi
      target: base
    profiles: [tools]
    volumes:
      - ./backends/python-fastapi:/work/backends/python-fastapi
      - ./bench:/work/bench
    working_dir: /work
    entrypoint: ["uv", "lock", "--directory"]

  # Go's module files, after a dependency changes:
  #   docker compose run --rm go-mod tidy
  # Then `docker compose build go-checks`.
  go-mod:
    build:
      context: backends/go
      target: base
    profiles: [tools]
    volumes:
      - ./backends/go:/src
    entrypoint: ["go", "mod"]
