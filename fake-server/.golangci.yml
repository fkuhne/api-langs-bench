# The fake server's gates, the same as the Go backends' (spec/decisions/0013, 0023): golangci-lint's
# standard linters, plus those that match the Python projects' ruff families.
version: "2"
linters:
  default: standard
  enable:
    - bodyclose # HTTP response bodies are closed
    - errorlint # errors are wrapped and compared as Go means since 1.13
    - gosec # security, as ruff's S
    - noctx # HTTP requests carry a context
    - revive # names and doc comments, as ruff's N
formatters:
  enable:
    - gofmt
    - goimports
