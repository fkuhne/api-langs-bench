# The conformance suite's pytest settings, apart from the gates' in pyproject.toml: it checks the
# backends, so it measures no coverage of this code (spec/decisions/0017). The repository is
# mounted read-only, hence no cache.
[pytest]
pythonpath = ..
addopts = -ra --strict-markers --strict-config -p no:cacheprovider -m "not llama_cpp"
# llama.cpp's checks need its model downloaded, so they run only when asked: -m llama_cpp, after
# `docker compose up -d --wait llama-cpp` (spec/decisions/0025).
markers =
    llama_cpp: checks each backend through llama.cpp's server, with a real model
filterwarnings = error
