openapi: 3.2.0
info:
  title: api-langs-bench chat API
  version: 1.0.0
  summary: The one API every backend implements.
  description: |
    ai-bootstrap's stateless chat, cut to text: the model's answer whole, or streamed as
    server-sent events, with liveness and readiness. Record 0010 says what was kept and why.

    This file describes the endpoints, the bodies and each event's data. What no schema says
    is in `README.md`, next to this file: the events' order, sending each event at once, a
    client that leaves, the fakes, and how answers are compared.

    `info.version` changes with every change to the contract.
  license:
    name: MIT No Attribution
    identifier: MIT-0
tags:
  - name: chat
    description: Ask the model, and get its answer whole or streamed.
  - name: health
    description: Liveness and readiness.
paths:
  /api/health:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness
      description: Answers while the process is up. It checks nothing else.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /api/health/ready:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness
      description: >-
        Checks the upstream, and answers 503 while it's unavailable. The in-process fake is
        always ready.
      responses:
        "200":
          description: The upstream is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: The upstream is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/chat:
    post:
      tags: [chat]
      operationId: chat
      summary: Ask the model, and get its whole answer
      description: Sends the messages and the parameters to the upstream, and returns its answer.
      requestBody:
        $ref: "#/components/requestBodies/Chat"
      responses:
        "200":
          description: The whole answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Completion"
        "422":
          $ref: "#/components/responses/InvalidBody"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Refused"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/TimedOut"
  /api/chat/stream:
    post:
      tags: [chat]
      operationId: chatStream
      summary: Ask the model, and stream its answer as server-sent events
      description: >-
        Once the body is valid, the answer is 200 and the stream starts. It sends `reasoning`
        events while the model reasons, `token` events with pieces of the answer, then `done`.
        If the upstream fails, even before the first token, an `error` event ends the stream
        instead, with the status the same request gets from `POST /api/chat`. Closing the
        stream stops the upstream.
      requestBody:
        $ref: "#/components/requestBodies/Chat"
      responses:
        "200":
          description: The answer, as a stream of server-sent events.
          headers:
            Cache-Control:
              description: The stream isn't cached.
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/ServerSentEvent"
                required: [event]
                oneOf:
                  - properties:
                      event:
                        const: reasoning
                      data:
                        contentMediaType: application/json
                        contentSchema:
                          $ref: "#/components/schemas/ReasoningDelta"
                  - properties:
                      event:
                        const: token
                      data:
                        contentMediaType: application/json
                        contentSchema:
                          $ref: "#/components/schemas/ContentDelta"
                  - properties:
                      event:
                        const: done
                      data:
                        contentMediaType: application/json
                        contentSchema:
                          $ref: "#/components/schemas/StreamEnd"
                  - properties:
                      event:
                        const: error
                      data:
                        contentMediaType: application/json
                        contentSchema:
                          $ref: "#/components/schemas/ErrorEvent"
        "422":
          $ref: "#/components/responses/InvalidBody"
components:
  requestBodies:
    Chat:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChatRequest"
          examples:
            short:
              summary: One question, a short answer
              value:
                messages:
                  - role: user
                    content: In one sentence, what is an LLM?
                parameters:
                  max_tokens: 5
  responses:
    InvalidBody:
      description: >-
        The body isn't a valid chat request. The `detail` is each framework's own, and isn't
        compared.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    RateLimited:
      description: The upstream is rate-limiting requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Refused:
      description: The upstream refused the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The upstream can't be reached, or is down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TimedOut:
      description: The upstream didn't answer in time.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ChatRequest:
      type: object
      description: The conversation so far, and any generation parameters. Other fields are ignored.
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        parameters:
          $ref: "#/components/schemas/Parameters"
    ChatMessage:
      type: object
      description: One message of the conversation. Text only.
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
    Parameters:
      type: object
      description: >-
        Any generation parameter, such as `max_tokens`, `temperature` or `seed`. The backend
        passes them to the upstream unchanged, and doesn't read them. It sets the four reserved
        keys itself, so a request that sends one is invalid. The fakes read `max_tokens` and
        `fake_error` (README.md).
      default: {}
      propertyNames:
        not:
          enum: [model, messages, stream, stream_options]
      additionalProperties: true
    Completion:
      type: object
      description: The whole answer, with the model's reasoning when it shows it.
      required: [content, model]
      properties:
        content:
          type: string
        reasoning:
          type: [string, "null"]
        model:
          type: string
        finish_reason:
          type: [string, "null"]
        usage:
          anyOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
    Usage:
      type: object
      description: The tokens one answer used, as the upstream counts them.
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    ReasoningDelta:
      type: object
      description: Data of a `reasoning` event, the next piece of the model's reasoning.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
    ContentDelta:
      type: object
      description: Data of a `token` event, the next piece of the answer.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
    StreamEnd:
      type: object
      description: Data of a `done` event, the last event of a stream that ended normally.
      required: [model]
      properties:
        model:
          type: string
        finish_reason:
          type: [string, "null"]
        usage:
          anyOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
    ErrorEvent:
      type: object
      description: >-
        Data of an `error` event, the last event of a stream the upstream's failure stopped.
        The `status` is what the same request gets from `POST /api/chat`.
      required: [status, detail]
      properties:
        status:
          type: integer
          enum: [429, 502, 503, 504]
        detail:
          type: string
    Error:
      type: object
      description: An upstream's failure. The `detail` gives its reason, and isn't compared.
      required: [detail]
      properties:
        detail:
          type: string
    ValidationError:
      type: object
      description: An invalid body. The `detail` is in each framework's own shape.
      required: [detail]
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      description: Whether the upstream can take requests.
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/CheckStatus"
        checks:
          type: object
          required: [llm]
          additionalProperties:
            $ref: "#/components/schemas/CheckStatus"
    CheckStatus:
      type: string
      enum: [ok, unavailable]
    ServerSentEvent:
      type: object
      description: >-
        One event of a `text/event-stream`, after parsing, as the OpenAPI 3.2 specification
        models it (§4.14.4).
      required: [data]
      properties:
        data:
          type: string
        event:
          type: string
        id:
          type: string
        retry:
          type: integer
          minimum: 0
