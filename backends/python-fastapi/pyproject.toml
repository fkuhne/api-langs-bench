[project]
name = "python-fastapi-backend"
version = "0.1.0"
description = "The Python backend: FastAPI, serving the contract (contract/README.md)."
requires-python = ">=3.14,<3.15"
# ai-bootstrap's pins, with uvicorn's standard extras: FastAPI's documented production install
# (spec/decisions/0014).
dependencies = [
    "fastapi==0.143.0",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
# The gates, as in ai-bootstrap, with the same pins (spec/decisions/0013).
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[tool.uv]
# An app, not a library: uv installs its dependencies, not the project itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
# A warning fails its test: a leak or a deprecation is fixed, not scrolled past.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "N",        # pep8-naming
    "S",        # flake8-bandit (security)
    "ASYNC",    # flake8-async
    "PT",       # flake8-pytest-style
    "C4",       # flake8-comprehensions
    "RET",      # flake8-return
    "PTH",      # flake8-use-pathlib
    "TID",      # flake8-tidy-imports
    "ARG",      # flake8-unused-arguments
    "RUF",      # Ruff-specific rules
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses assert
    "ARG",   # test doubles implement interfaces whose arguments they don't need
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
